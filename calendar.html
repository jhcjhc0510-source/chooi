<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>효도발견 발행 캘린더</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f7f6f2;color:#293027;margin:0}header{padding:22px max(18px,calc((100vw - 1050px)/2));background:white;border-bottom:1px solid #e3e4df}h1{font-size:23px;margin:0 0 8px}a{color:#43634c}main{max-width:1050px;padding:20px;margin:auto}.panel{background:white;border:1px solid #e1e4dc;border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:14px}.day{min-height:95px;border:1px solid #e4e7df;border-radius:9px;padding:8px;overflow-wrap:anywhere}.day.out{opacity:.35}.day.today{border:2px solid #557663}.day b{font-size:12px}.chip{margin-top:5px;background:#eef2ea;border-radius:5px;padding:5px;font-size:11px;line-height:1.3}.chip.done{background:#e2ebe6}.chip.pending{background:#fff1d9}.label{font-size:12px;color:#7a7e74}button{background:white;border:1px solid #d5d9d2;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}button.primary{background:#334336;color:white}.entry{border:1px solid #e7e9e3;border-radius:9px;padding:12px;margin:8px 0}.entry small{color:#737a70}input,select{padding:10px;border:1px solid #ccd2c9;border-radius:8px;min-width:0;width:100%}form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}form label{font-size:13px}form button{align-self:end}.alert{background:#fff4dd;padding:12px;border-radius:8px;margin:8px 0}@media(max-width:720px){.grid{gap:3px}.day{min-height:75px;padding:4px}.chip{padding:3px;font-size:9px}form{grid-template-columns:1fr}}</style></head><body>
<header><h1>효도발견 발행 캘린더</h1><div class="label">콘텐츠 스튜디오 기록과 연결 · SNS 자동 발행 아님</div><p><a href="./index.html">대시보드</a> · <a href="./studio.html">콘텐츠 스튜디오</a></p></header>
<main><div class="panel"><div class="row"><button id="prev">← 이전 달</button><h2 id="month"></h2><button id="next">다음 달 →</button></div><div class="grid" id="calendar"></div></div>
<div class="panel"><h2>콘텐츠 발행 일정 설정</h2><form id="schedule"><label>콘텐츠<select id="draft" required></select></label><label>발행 예정일<input id="date" type="date" required></label><button class="primary">일정 저장</button></form><p class="label">콘텐츠 스튜디오에서 작성한 초안을 선택하세요. 일정은 같은 브라우저의 스튜디오 데이터에 저장됩니다.</p></div>
<div class="panel"><h2>일정 목록과 할 일</h2><div id="items"></div></div>
<div class="panel"><h2>운영 주의사항</h2><p class="label">휴대폰에서 이 사이트를 열어 기록한 내용은 그 기기의 브라우저에만 저장됩니다. GitHub Pages만 켠다고 기기 간 동기화되지는 않습니다. 중요한 데이터는 콘텐츠 스튜디오의 JSON 백업을 이용해 보관하세요.</p></div></main>
<script>
"use strict";const KEY="hyodo-studio-v1";const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.drafts))db={references:[],drafts:[],results:[]};
const now=new Date();let year=now.getFullYear(),month=now.getMonth();const iso=(y,m,d)=>[y,String(m+1).padStart(2,"0"),String(d).padStart(2,"0")].join("-");
function paint(){
$("month").textContent=year+"년 "+(month+1)+"월";
$("draft").innerHTML='<option value="">콘텐츠 선택</option>'+db.drafts.map(d=>'<option value="'+esc(d.id)+'">'+esc(d.title)+'</option>').join("");
let first=new Date(year,month,1),start=first.getDay(),total=new Date(year,month+1,0).getDate();let heads=["일","월","화","수","목","금","토"].map(v=>'<b class="label">'+v+'</b>').join("");let cells="";
for(let p=0;p<Math.ceil((start+total)/7)*7;p++){const day=p-start+1,active=day>0&&day<=total,dt=iso(year,month,day),entries=active?db.drafts.filter(x=>x.scheduledDate===dt):[];cells+='<div class="day '+(!active?'out':'')+' '+(dt===iso(now.getFullYear(),now.getMonth(),now.getDate())?'today':'')+'"><b>'+(active?day:"")+'</b>'+entries.map(x=>'<div class="chip '+(x.status==="발행 완료"?"done":"pending")+'">'+esc(x.title)+' <small>'+esc(x.status)+'</small></div>').join("")+'</div>'}
$("calendar").innerHTML=heads+cells;
const scheduled=db.drafts.filter(x=>x.scheduledDate).slice().sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate));
$("items").innerHTML=scheduled.map(d=>'<div class="entry"><div class="row"><div><strong>'+esc(d.title)+'</strong><br><small>'+esc(d.scheduledDate)+' · '+esc(d.status)+'</small></div><button data-clear="'+esc(d.id)+'">일정 해제</button></div></div>').join("")||'<p class="label">아직 등록된 일정이 없습니다. 콘텐츠 스튜디오에서 초안을 만들고 날짜를 정하세요.</p>';
const late=scheduled.filter(x=>x.scheduledDate<iso(now.getFullYear(),now.getMonth(),now.getDate())&&x.status!=="발행 완료");if(late.length)$("items").insertAdjacentHTML("afterbegin",'<div class="alert">예정일이 지난 미발행 콘텐츠 '+late.length+'건을 확인하세요.</div>');
}
$("schedule").onsubmit=e=>{e.preventDefault();const d=db.drafts.find(x=>x.id===$("draft").value);if(!d)return;d.scheduledDate=$("date").value;try{localStorage.setItem(KEY,JSON.stringify(db));paint()}catch{alert("저장 실패: 브라우저 설정을 확인하세요")}};
$("items").onclick=e=>{const id=e.target.closest("[data-clear]")?.dataset.clear;if(!id)return;const d=db.drafts.find(x=>x.id===id);if(!d)return;delete d.scheduledDate;localStorage.setItem(KEY,JSON.stringify(db));paint()};
$("prev").onclick=()=>{month--;if(month<0){month=11;year--}paint()};$("next").onclick=()=>{month++;if(month>11){month=0;year++}paint()};paint();
</script></body></html>
