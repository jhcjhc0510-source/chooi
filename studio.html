<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>효도발견 콘텐츠 스튜디오</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#292b25;background:#f6f5f1}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #e2e3dc;padding:20px max(18px,calc((100vw - 1080px)/2))}h1{font-size:23px;margin:0 0 6px}.muted,small{color:#75796f}a{color:#405c4a}main{max-width:1080px;margin:24px auto;padding:0 18px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{border:1px solid #d8dbd2;background:white;padding:10px 13px;border-radius:10px;font:inherit;cursor:pointer}button.active,button.primary{background:#2f3b31;color:white;border-color:#2f3b31}.panel{border:1px solid #e1e4dd;background:white;border-radius:15px;padding:20px;margin-bottom:15px}h2{font-size:19px;margin:0 0 15px}h3{font-size:15px;margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{font-size:13px;color:#585f56}input,select,textarea{width:100%;border:1px solid #ccd2c9;border-radius:8px;padding:10px;font:inherit;margin-top:5px;background:white}.wide{grid-column:1/-1}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.item{border:1px solid #e6e9e2;padding:14px;border-radius:11px;margin-top:9px}.item p{margin:7px 0;color:#636b60;white-space:pre-wrap}.pill{font-size:12px;background:#eef0e9;border-radius:20px;padding:4px 8px}.actions{display:flex;flex-wrap:wrap;gap:7px}.danger{color:#9e443b}section[hidden]{display:none}textarea{min-height:90px}.stat{background:#fafbf8;border-radius:12px;padding:14px}.stat strong{display:block;font-size:25px;margin-top:5px}@media(max-width:650px){.grid,form{grid-template-columns:1fr}} 
</style></head><body>
<header><h1>효도발견 · 콘텐츠 스튜디오</h1><small>바이럴 레퍼런스 → 초안 → 승인 → 발행 → 성과</small><p><a href="./index.html">← 운영 대시보드</a> · <a href="./calendar.html">발행 캘린더 열기 →</a></p></header>
<main><p class="muted">모든 기록은 현재 브라우저에 저장됩니다. 다른 기기와 자동 동기화되지 않습니다. 외부 SNS 계정에 게시하지 않습니다.</p>
<nav class="tabs"><button data-tab="overview" class="active">운영 현황</button><button data-tab="references">레퍼런스</button><button data-tab="drafts">콘텐츠 제작</button><button data-tab="results">발행·성과</button><button data-tab="export">백업</button></nav>
<section id="overview"><div class="grid" id="kpis"></div><div class="panel"><h2>오늘 확인할 작업</h2><div id="todos"></div></div></section>
<section id="references" hidden><div class="panel"><h2>바이럴 레퍼런스 등록</h2><form id="referenceForm"><input type="hidden" name="id"><label>콘텐츠 제목<input name="title" required maxlength="160"></label><label>플랫폼<select name="platform"><option>Instagram</option><option>Threads</option><option>YouTube</option><option>기타</option></select></label><label class="wide">원본 URL<input type="url" name="url" required placeholder="https://..."></label><label>조회수 (확인된 수치만)<input type="number" min="0" name="views"></label><label>계정 평소 조회수 중앙값<input type="number" min="0" name="baseline"></label><label>확인 날짜<input type="date" name="checked"></label><label>분류<select name="category"><option>공감 콘텐츠</option><option>제품 추천</option><option>생활 정보</option></select></label><label class="wide">눈에 띈 훅과 참고 포인트<textarea name="insight"></textarea></label><div class="wide actions"><button class="primary">레퍼런스 저장</button><button type="reset">초기화</button></div></form></div><div class="panel"><h2>수집한 레퍼런스</h2><div id="referenceList"></div></div></section>
<section id="drafts" hidden><div class="panel"><h2>콘텐츠 초안 만들기</h2><form id="draftForm"><input type="hidden" name="id"><label>제목<input name="title" required maxlength="160"></label><label>형식<select name="format"><option>카드뉴스</option><option>릴스</option><option>스레드 텍스트</option></select></label><label>참고 레퍼런스<select name="reference" id="draftReference"></select></label><label>상태<select name="status"><option>아이디어</option><option>초안</option><option>검수 대기</option><option>승인 완료</option><option>발행 완료</option></select></label><label class="wide">표지/첫 3초 훅<input name="hook" placeholder="부모님 집에서 발견한 작은 불편"></label><label class="wide">카드뉴스 장별 문구 또는 릴스 대본<textarea name="script" required rows="6"></textarea></label><label class="wide">캡션 및 제휴 표기 메모<textarea name="caption"></textarea></label><div class="wide actions"><button class="primary">초안 저장</button><button type="reset">초기화</button></div></form></div><div class="panel"><div class="row"><h2>콘텐츠 제작함</h2><button id="starter">센서등 실험 초안 불러오기</button></div><div id="draftList"></div></div></section>
<section id="results" hidden><div class="panel"><h2>발행 및 성과 기록</h2><form id="resultForm"><input type="hidden" name="id"><label>콘텐츠<select name="draft" id="resultDraft" required></select></label><label>발행 날짜<input type="date" name="date" required></label><label class="wide">실제 게시 URL<input type="url" name="url" placeholder="https://..."></label><label>조회수<input type="number" min="0" name="views" value="0"></label><label>공유수<input type="number" min="0" name="shares" value="0"></label><label>저장수<input type="number" min="0" name="saves" value="0"></label><label>링크 클릭수<input type="number" min="0" name="clicks" value="0"></label><label>수수료 (원)<input type="number" min="0" name="fee" value="0"></label><label class="wide">다음 개선 아이디어<textarea name="learning"></textarea></label><div class="wide actions"><button class="primary">성과 저장</button><button type="reset">초기화</button></div></form></div><div class="panel"><h2>발행 결과</h2><div id="resultList"></div></div></section>
<section id="export" hidden><div class="panel"><h2>콘텐츠 스튜디오 데이터 관리</h2><p>JSON 백업은 레퍼런스, 초안, 성과 전체를 저장합니다. 복원 시 현재 스튜디오 데이터가 교체됩니다.</p><div class="actions"><button id="backup" class="primary">전체 백업</button><label>JSON 복원 파일<input id="restore" type="file" accept=".json,application/json"></label></div></div></section></main>
<script>
"use strict";
const KEY="hyodo-studio-v1", fresh=()=>({references:[],drafts:[],results:[]});
function valid(d){return d&&["references","drafts","results"].every(k=>Array.isArray(d[k])&&d[k].every(x=>x&&typeof x.id==="string"))}
function get(){try{const d=JSON.parse(localStorage.getItem(KEY));return valid(d)?d:fresh()}catch{return fresh()}}
let db=get(),tab="overview";const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>typeof crypto!=="undefined"&&crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
const fmt=n=>Number(n||0).toLocaleString("ko-KR");
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));render()}catch{alert("저장 오류: 브라우저 공간이나 설정을 확인하세요.")}}
function name(k,id){return db[k].find(x=>x.id===id)?.title||"연결 없음"}
function opts(k,empty){return '<option value="">'+empty+'</option>'+db[k].map(x=>'<option value="'+esc(x.id)+'">'+esc(x.title)+'</option>').join("")}
function goto(x){tab=x;document.querySelectorAll("section").forEach(s=>s.hidden=s.id!==x);document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===x));render()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>goto(b.dataset.tab));
function entry(title,desc,body,k,id,extra=""){return '<article class="item"><div class="row"><h3>'+esc(title)+'</h3><div class="actions">'+extra+'<button data-edit="'+k+':'+esc(id)+'">수정</button><button class="danger" data-del="'+k+':'+esc(id)+'">삭제</button></div></div><small>'+esc(desc)+'</small><p>'+esc(body)+'</p></article>'}
function render(){
$("draftReference").innerHTML=opts("references","레퍼런스 없이 작성");
$("resultDraft").innerHTML=opts("drafts","콘텐츠 선택");
$("referenceList").innerHTML=db.references.map(x=>{const ratio=Number(x.baseline)>0&&x.views!==""?(Number(x.views)/Number(x.baseline)).toFixed(1)+"배":"자료 부족";return entry(x.title,[x.platform,x.category,"확인 "+(x.checked||"미기록"),"평소 대비 "+ratio].join(" · "),x.insight,"references",x.id,'<a target="_blank" rel="noopener noreferrer" href="'+esc(x.url)+'">원본 보기</a>')}).join("")||'<p class="muted">첫 레퍼런스를 등록해 주세요.</p>';
$("draftList").innerHTML=db.drafts.map(x=>entry(x.title,x.format+" · "+x.status+" · 참고: "+name("references",x.reference),x.hook+"\n"+x.script,"drafts",x.id,'<button data-step="'+esc(x.id)+'">다음 단계</button>')).join("")||'<p class="muted">아직 작성한 초안이 없습니다.</p>';
$("resultList").innerHTML=db.results.map(x=>entry(name("drafts",x.draft),x.date+" · 조회 "+fmt(x.views)+" · 공유 "+fmt(x.shares)+" · 저장 "+fmt(x.saves)+" · 클릭 "+fmt(x.clicks)+" · 수수료 "+fmt(x.fee)+"원",x.learning||"개선 메모 없음","results",x.id)).join("")||'<p class="muted">발행 성과가 없습니다.</p>';
let counts=[["레퍼런스",db.references.length],["검수 대기",db.drafts.filter(x=>x.status==="검수 대기").length],["승인 완료",db.drafts.filter(x=>x.status==="승인 완료").length],["수수료 누적",fmt(db.results.reduce((s,x)=>s+Number(x.fee||0),0))+"원"]];
$("kpis").innerHTML=counts.map(x=>'<div class="stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join("");
let tasks=[];if(!db.references.length)tasks.push("이번 주 참고할 바이럴 레퍼런스 3개 수집");if(!db.drafts.length)tasks.push("첫 콘텐츠 초안 제작");let pending=db.drafts.filter(x=>x.status==="검수 대기");if(pending.length)tasks.push("승인 검토 필요한 초안 "+pending.length+"개");let approved=db.drafts.filter(x=>x.status==="승인 완료");if(approved.length)tasks.push("발행 예정 초안 "+approved.length+"개 확인");let untracked=db.drafts.filter(x=>x.status==="발행 완료"&&!db.results.some(r=>r.draft===x.id));if(untracked.length)tasks.push("성과 미기록 게시물 "+untracked.length+"개");$("todos").innerHTML=(tasks.length?tasks:["현재 긴급 작업이 없습니다. 최근 성과를 확인하세요."]).map(s=>'<div class="item">'+esc(s)+'</div>').join("")
}
const forms={references:"referenceForm",drafts:"draftForm",results:"resultForm"};
for(const [kind,id] of Object.entries(forms)){$(id).onsubmit=e=>{e.preventDefault();const f=e.currentTarget,o=Object.fromEntries(new FormData(f).entries());o.id=o.id||uid();if(kind==="results"){if(!o.draft){alert("콘텐츠를 선택하세요");return}for(const k of ["views","shares","saves","clicks","fee"])o[k]=Math.max(0,Number(o[k]||0))}const n=db[kind].findIndex(x=>x.id===o.id);if(n===-1)db[kind].unshift(o);else db[kind][n]=o;f.reset();save()}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-edit],[data-del],[data-step]");if(!b)return;
if(b.dataset.step){const x=db.drafts.find(x=>x.id===b.dataset.step);if(!x)return;const statuses=["아이디어","초안","검수 대기","승인 완료","발행 완료"];if(x.status==="검수 대기"&&!confirm("내용을 검토하고 승인했나요?"))return;if(x.status==="승인 완료"&&!confirm("실제로 게시했나요? 아직 게시하지 않았다면 취소하세요."))return;x.status=statuses[Math.min(statuses.length-1,statuses.indexOf(x.status)+1)];save();return}
const [kind,id]=(b.dataset.edit||b.dataset.del).split(":"),x=db[kind].find(z=>z.id===id);if(!x)return;
if(b.dataset.del){const linked=kind==="references"&&db.drafts.some(d=>d.reference===id)||kind==="drafts"&&db.results.some(r=>r.draft===id);if(!confirm(linked?"연결된 기록이 있습니다. 삭제하면 연결명이 사라집니다. 계속할까요?":"기록을 삭제할까요?"))return;db[kind]=db[kind].filter(z=>z.id!==id);save();return}
goto(kind);const f=$(forms[kind]);for(const [k,v] of Object.entries(x)){let el=f.elements.namedItem(k);if(el)el.value=v}f.scrollIntoView({behavior:"smooth"})
});
$("starter").onclick=()=>{const title="엄마 집에 갔다가, 처음 알았던 불편";if(db.drafts.some(x=>x.title===title)){alert("이미 같은 제목의 실험 초안이 있습니다.");return}db.drafts.unshift({id:uid(),title,format:"카드뉴스",reference:"",status:"초안",hook:title,script:"1. 엄마 집에 갔다가, 처음 알았던 불편\n2. 침대에서 불 스위치까지 몇 걸음\n3. 별거 아닌 듯해도 매일 반복되는 일\n4. 뭐가 제일 불편한지 먼저 물어봤다\n5. 부모님 집에서 발견한 작은 불편, 또 있나요?",caption:"제품을 소개하기보다 부모님의 실제 불편에 공감하는 콘텐츠. 실사 사진 사용."});save()};
function download(name,text){let u=URL.createObjectURL(new Blob([text],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$("backup").onclick=()=>download("hyodo-studio-backup.json",JSON.stringify(db,null,2));
$("restore").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!valid(d))throw Error("파일 구조 오류");if(confirm("현재 스튜디오 데이터를 덮어쓸까요?")){db=d;save()}}catch(err){alert("복원 실패: "+err.message)}e.target.value=""};
render();
</script></body></html>
