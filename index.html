<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>효도발견 OS</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#252721;background:#f6f5f0}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e3e2dc;padding:20px max(20px,calc((100vw - 1100px)/2))}h1{margin:0;font-size:23px}small,.muted{color:#74776c}.wrap{max-width:1100px;margin:26px auto;padding:0 20px}nav{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:25px}button{font:inherit;cursor:pointer;border:1px solid #d8d9d2;background:#fff;border-radius:9px;padding:10px 15px}button.active,button.primary{background:#30372c;color:#fff;border-color:#30372c}.danger{color:#a43d36}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:white;border:1px solid #e4e5df;border-radius:15px;padding:19px}.card strong{display:block;font-size:27px;margin-top:11px}.panel{margin:16px 0}h2{font-size:19px;margin:0 0 14px}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.list{display:grid;gap:9px}.item{border:1px solid #e5e6e0;border-radius:11px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:15px}.item b{display:block}.actions{display:flex;gap:6px;flex-wrap:wrap}label{font-size:13px;color:#62665d;display:block}input,select,textarea{width:100%;background:#fff;border:1px solid #cfd2c9;border-radius:8px;padding:10px;font:inherit;margin-top:5px}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}form .wide{grid-column:1/-1}form button{justify-self:start}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;text-align:left;border-bottom:1px solid #ebede7}th{color:#73786c}section[hidden]{display:none}.tag{border-radius:30px;padding:4px 8px;background:#eef0ea;font-size:12px}a{color:#3b6251;overflow-wrap:anywhere}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}form{grid-template-columns:1fr}.item{align-items:start;flex-direction:column}}
</style></head>
<body><header><h1>효도발견 OS</h1><small>콘텐츠 → 제품 → 수익을 연결하는 운영 공간 · 로컬 저장</small></header>
<main class="wrap"><div class="panel"><div class="row"><div><strong>지금 바로 콘텐츠 만들기</strong><div><small>주제 하나로 카드뉴스·스레드·릴스 초안 생성</small></div></div><a href="./create.html">콘텐츠 제작기 열기 →</a></div></div><div class="panel"><div class="row"><strong>인스타그램 콘텐츠 스튜디오</strong><a href="./studio.html">레퍼런스 · 초안 · 승인 · 성과 관리 열기 →</a> · <a href="./calendar.html">발행 캘린더 →</a></div></div>
<nav><button data-tab="home" class="active">오늘의 운영</button><button data-tab="contents">콘텐츠</button><button data-tab="products">제품</button><button data-tab="income">성과·수익</button><button data-tab="backup">백업</button></nav>
<section id="home"><div class="cards" id="stats"></div><div class="panel"><h2>다음 행동</h2><div id="next" class="list"></div></div><div class="panel"><h2>수익 기여 콘텐츠</h2><div id="leaders"></div></div></section>
<section id="contents" hidden><div class="panel"><h2>콘텐츠 등록·수정</h2><form id="contentForm"><input type="hidden" name="id"><label>제목<input required name="title" maxlength="150"></label><label>플랫폼<select name="platform"><option>Threads</option><option>Instagram</option></select></label><label>형식<select name="format"><option>텍스트</option><option>카드뉴스</option><option>릴스</option></select></label><label>상태<select name="status"><option>아이디어</option><option>제작 중</option><option>예약 예정</option><option>발행 완료</option></select></label><label>발행 예정일<input type="date" name="date"></label><label>관련 제품<select name="product" id="contentProduct"></select></label><label class="wide">게시 URL<input type="url" name="url" placeholder="https://..."></label><label class="wide">메모<textarea name="memo" rows="2"></textarea></label><div class="wide actions"><button class="primary">저장</button><button type="reset">입력 초기화</button></div></form></div><div class="panel"><div class="row"><h2>콘텐츠 목록</h2><select id="contentFilter" aria-label="상태 필터"><option value="">전체 상태</option><option>아이디어</option><option>제작 중</option><option>예약 예정</option><option>발행 완료</option></select></div><div id="contentList" class="list"></div></div></section>
<section id="products" hidden><div class="panel"><h2>제품 등록·수정</h2><form id="productForm"><input type="hidden" name="id"><label>제품명<input required name="name"></label><label>국가<input name="country" placeholder="한국 / 일본 / 미국"></label><label>가격 (원)<input type="number" min="0" name="price"></label><label>검증 단계<select name="stage"><option>조사 중</option><option>검토 완료</option><option>콘텐츠 제작</option><option>보류</option></select></label><label class="wide">상품 출처 링크<input type="url" name="source" placeholder="https://..."></label><label class="wide">제휴 링크<input type="url" name="affiliate" placeholder="https://..."></label><label class="wide">선정 이유·메모<textarea name="memo" rows="2"></textarea></label><div class="wide actions"><button class="primary">저장</button><button type="reset">입력 초기화</button></div></form></div><div class="panel"><h2>제품 목록</h2><div id="productList" class="list"></div></div></section>
<section id="income" hidden><div class="panel"><h2>성과·수익 입력 (수동)</h2><form id="incomeForm"><input type="hidden" name="id"><label>날짜<input type="date" required name="date"></label><label>콘텐츠<select name="content" id="incomeContent" required></select></label><label>제품<select name="product" id="incomeProduct"></select></label><label>클릭수<input type="number" min="0" name="clicks" value="0"></label><label>주문 금액 (원)<input type="number" min="0" name="sales" value="0"></label><label>수수료 (원)<input type="number" min="0" name="fee" value="0"></label><div class="wide actions"><button class="primary">기록 저장</button><button type="reset">입력 초기화</button></div></form></div><div class="panel"><h2>기록 목록</h2><div id="incomeList" class="list"></div></div></section>
<section id="backup" hidden><div class="panel"><h2>데이터 백업·복원</h2><p class="muted">데이터는 이 브라우저에만 저장됩니다. 기기 변경이나 브라우저 데이터 삭제에 대비해 자주 백업하세요.</p><div class="actions"><button id="exportJson" class="primary">JSON 백업</button><button id="exportCsv">성과 CSV 다운로드</button><label>JSON 복원 파일 선택<input id="importJson" type="file" accept=".json,application/json"></label></div></div></section>
</main>
<script>
"use strict";
const KEY="hyodo-os-v1";
const empty=()=>({contents:[],products:[],income:[]});
let db=load();let tab="home";
const $=id=>document.getElementById(id);
const won=n=>Number(n||0).toLocaleString("ko-KR")+"원";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
function valid(x){return x&&typeof x==="object"&&["contents","products","income"].every(k=>Array.isArray(x[k])&&x[k].every(i=>i&&typeof i==="object"&&typeof i.id==="string"))}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));return valid(d)?d:empty()}catch{return empty()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));render()}catch(e){alert("저장하지 못했습니다. 브라우저 저장 공간을 확인하세요.")}}
function nameOf(type,id){return db[type].find(x=>x.id===id)?.[type==="contents"?"title":"name"]||"연결 없음"}
function options(type,placeholder){return '<option value="">'+placeholder+'</option>'+db[type].map(x=>'<option value="'+esc(x.id)+'">'+esc(type==="contents"?x.title:x.name)+'</option>').join("")}
function show(t){tab=t;document.querySelectorAll("section").forEach(s=>s.hidden=s.id!==t);document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>show(b.dataset.tab));
function item(title,desc,type,id){return '<div class="item"><div><b>'+esc(title)+'</b><small>'+esc(desc)+'</small></div><div class="actions"><button data-edit="'+type+":"+esc(id)+'">수정</button><button class="danger" data-delete="'+type+":"+esc(id)+'">삭제</button></div></div>'}
function render(){
 $("contentProduct").innerHTML=options("products","제품 연결 안 함");
 $("incomeProduct").innerHTML=options("products","제품 미지정");
 $("incomeContent").innerHTML=options("contents","콘텐츠 선택");
 const filter=$("contentFilter").value;
 $("contentList").innerHTML=db.contents.filter(x=>!filter||x.status===filter).map(x=>item(x.title,[x.platform,x.format,x.status,x.date||"날짜 미정",nameOf("products",x.product)].join(" · "),"contents",x.id)).join("")||"<p class=muted>등록한 콘텐츠가 없습니다.</p>";
 $("productList").innerHTML=db.products.map(x=>item(x.name,[x.country,x.stage,won(x.price),"연결 콘텐츠 "+db.contents.filter(c=>c.product===x.id).length+"건"].join(" · "),"products",x.id)).join("")||"<p class=muted>등록한 제품이 없습니다.</p>";
 $("incomeList").innerHTML=db.income.map(x=>item(nameOf("contents",x.content),[x.date,nameOf("products",x.product),"클릭 "+x.clicks,"수수료 "+won(x.fee)].join(" · "),"income",x.id)).join("")||"<p class=muted>수익 기록이 없습니다.</p>";
 const published=db.contents.filter(x=>x.status==="발행 완료").length,scheduled=db.contents.filter(x=>x.status==="예약 예정").length,fees=db.income.reduce((a,x)=>a+Number(x.fee||0),0);
 $("stats").innerHTML=[["예약 예정",scheduled+"건"],["발행 완료",published+"건"],["검토 중 제품",db.products.filter(x=>x.stage==="조사 중").length+"개"],["누적 수수료",won(fees)]].map(([a,b])=>'<div class="card"><small>'+a+'</small><strong>'+b+'</strong></div>').join("");
 const today=new Date().toLocaleDateString("sv-SE"),late=db.contents.filter(x=>x.status==="예약 예정"&&x.date&&x.date<today),unlinked=db.contents.filter(x=>x.status==="발행 완료"&&!x.product),unmeasured=db.contents.filter(x=>x.status==="발행 완료"&&!db.income.some(r=>r.content===x.id));
 $("next").innerHTML=[late.length&&"예정일이 지난 콘텐츠 "+late.length+"건 확인",unlinked.length&&"제품 미연결 발행 콘텐츠 "+unlinked.length+"건 검토",unmeasured.length&&"성과 기록이 없는 발행 콘텐츠 "+unmeasured.length+"건 확인",!db.contents.length&&"첫 콘텐츠 등록하기"].filter(Boolean).map(s=>'<div class="item">'+esc(s)+'</div>').join("")||'<p class=muted>긴급 점검 항목이 없습니다.</p>';
 const totals={};db.income.forEach(x=>totals[x.content]=(totals[x.content]||0)+Number(x.fee||0));
 $("leaders").innerHTML=Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,v])=>'<div class="item"><b>'+esc(nameOf("contents",id))+'</b><strong>'+won(v)+'</strong></div>').join("")||"<p class=muted>연결된 수익 데이터가 쌓이면 표시됩니다.</p>";
}
function bind(formId,type){$(formId).addEventListener("submit",e=>{e.preventDefault();const f=e.currentTarget;const o=Object.fromEntries(new FormData(f).entries());o.id=o.id||uid();if(type==="income"){for(const k of ["clicks","sales","fee"])o[k]=Math.max(0,Number(o[k]||0))}if(type==="products")o.price=Math.max(0,Number(o.price||0));const n=db[type].findIndex(x=>x.id===o.id);if(n<0)db[type].unshift(o);else db[type][n]=o;f.reset();save()})}
bind("contentForm","contents");bind("productForm","products");bind("incomeForm","income");$("contentFilter").onchange=render;
document.addEventListener("click",e=>{const b=e.target.closest("[data-edit],[data-delete]");if(!b)return;const key=b.dataset.edit||b.dataset.delete;const [type,id]=key.split(":");const record=db[type].find(x=>x.id===id);if(!record)return;if(b.dataset.delete){if(type==="products"&&db.contents.some(x=>x.product===id)&&!confirm("연결된 콘텐츠가 있습니다. 연결이 끊깁니다. 계속할까요?"))return;if(type==="contents"&&db.income.some(x=>x.content===id)&&!confirm("관련 수익 기록이 남아 이름이 표시되지 않습니다. 삭제할까요?"))return;if(!confirm("삭제할까요?"))return;db[type]=db[type].filter(x=>x.id!==id);save();return}const form=$(type==="contents"?"contentForm":type==="products"?"productForm":"incomeForm");show(type);Object.entries(record).forEach(([k,v])=>{if(form.elements.namedItem(k))form.elements.namedItem(k).value=v});form.scrollIntoView({behavior:"smooth",block:"start"})});
function download(name,body,mime){const url=URL.createObjectURL(new Blob([body],{type:mime}));const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$("exportJson").onclick=()=>download("hyodo-backup.json",JSON.stringify(db,null,2),"application/json");
$("exportCsv").onclick=()=>{const rows=[["date","content","product","clicks","sales","fee"],...db.income.map(x=>[x.date,nameOf("contents",x.content),nameOf("products",x.product),x.clicks,x.sales,x.fee])];download("hyodo-income.csv","\ufeff"+rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv;charset=utf-8")};
$("importJson").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!valid(d))throw Error("구조가 올바르지 않습니다.");if(confirm("현재 기록을 모두 덮어쓰고 복원할까요?")){db=d;save()}}catch(err){alert("복원 실패: "+err.message)}e.target.value=""};
render();
</script></body></html>
